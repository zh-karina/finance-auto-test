services:
  finance-app:
    build: .
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  finance-test:
    build: .
    environment:
      - BASE_URL=http://finance-app:8000
    volumes:
      - ./reports/allure-results:/app/reports/allure-results